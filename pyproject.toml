[project]
name = "localllm"
version = "0.1.0"
description = "LocalLLM CLI — a Claude-Code-style terminal client for the LocalLLM bridge"
requires-python = ">=3.10"

[project.scripts]
localllm = "localllm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["localllm*"]

# event_types is shared between the bridge (agent.py) and the CLI
# (localllm.events). It's a single-file module at repo root rather than a
# package, so list it explicitly here so editable installs put it on
# sys.path — without this, `localllm` from a foreign cwd fails to import
# event_types because it's neither in the localllm package nor in the cwd.
[tool.setuptools]
py-modules = ["event_types"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
