<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LocalLLM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link
    id="hljs-theme"
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
  />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <script>
    if (window.tailwind) {
      tailwind.config = {
        darkMode: "class",
        theme: { extend: {} }
      };
    }
  </script>
  <style>
    :root {
      --llm-bg: linear-gradient(160deg, #ede9fe 0%, #e0e7ff 50%, #f0f4ff 100%);
      --llm-panel: rgba(255,255,255,0.65);
      --llm-panel-border: rgba(139,92,246,0.13);
      --llm-blur: blur(12px);
      --llm-text: #1e1b4b;
      --llm-text-muted: #6d6a8a;
      --llm-shadow: 0 4px 24px rgba(139,92,246,0.10);
      --llm-accent: linear-gradient(135deg, #06b6d4, #0ea5e9);
      --llm-accent-solid: #06b6d4;
      --llm-accent-glow: rgba(6,182,212,0.35);
    }
    html.dark {
      --llm-bg: linear-gradient(160deg, #0f0c29 0%, #1a1040 45%, #1e1535 100%);
      --llm-panel: rgba(255,255,255,0.06);
      --llm-panel-border: rgba(255,255,255,0.10);
      --llm-text: #f0eeff;
      --llm-text-muted: #9d9abf;
      --llm-shadow: 0 4px 24px rgba(0,0,0,0.40);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--llm-bg);
      color: var(--llm-text);
      height: 100vh;
      display: flex;
      overflow: hidden;
      min-height: 0;
      transition: background 0.3s, color 0.3s;
    }

    /* ── Icon Rail ── */
    .rail {
      width: 56px;
      flex-shrink: 0;
      background: var(--llm-panel);
      border-right: 1px solid var(--llm-panel-border);
      backdrop-filter: var(--llm-blur);
      -webkit-backdrop-filter: var(--llm-blur);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 0;
      gap: 4px;
      z-index: 20;
      position: relative;
    }
    .rail-logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #06b6d4, #0ea5e9);
      border-radius: 9px;
      box-shadow: 0 2px 10px rgba(6,182,212,0.45);
      margin-bottom: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 800; color: white;
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }
    .rail-divider {
      width: 28px; height: 1px;
      background: var(--llm-panel-border);
      margin: 6px 0;
    }
    .rail-btn {
      width: 36px; height: 36px;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: var(--llm-text-muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      transition: all 0.15s;
    }
    .rail-btn:hover { background: var(--llm-panel); color: var(--llm-text); }
    .rail-btn.active {
      background: rgba(6,182,212,0.15);
      color: var(--llm-accent-solid);
      box-shadow: 0 0 0 1px rgba(6,182,212,0.30);
    }
    .rail-spacer { flex: 1; }
    .rail-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: white;
      cursor: default;
    }
    .rail-theme-toggle {
      width: 36px; height: 20px;
      background: rgba(6,182,212,0.15);
      border: 1px solid rgba(6,182,212,0.35);
      border-radius: 10px;
      cursor: pointer;
      position: relative;
      margin-bottom: 6px;
    }
    .rail-theme-toggle::after {
      content: '';
      position: absolute;
      left: 3px; top: 3px;
      width: 12px; height: 12px;
      background: var(--llm-accent-solid);
      border-radius: 50%;
      transition: left 0.2s;
    }
    html.dark .rail-theme-toggle::after { left: 19px; }

    /* ── Sidebar overlay panel ── */
    .sidebar-panel {
      position: absolute;
      left: 56px; top: 0; bottom: 0;
      width: 240px;
      background: var(--llm-panel);
      border-right: 1px solid var(--llm-panel-border);
      backdrop-filter: var(--llm-blur);
      -webkit-backdrop-filter: var(--llm-blur);
      box-shadow: var(--llm-shadow);
      display: flex; flex-direction: column;
      padding: 12px 10px;
      z-index: 15;
      transition: transform 0.22s cubic-bezier(0.4,0,0.2,1), opacity 0.22s;
    }
    .sidebar-panel.panel-hidden {
      transform: translateX(-8px);
      opacity: 0;
      pointer-events: none;
    }
    .sidebar-new-btn {
      display: flex; align-items: center; gap: 8px;
      background: rgba(6,182,212,0.10);
      border: 1px solid rgba(6,182,212,0.28);
      border-radius: 9px;
      padding: 8px 12px;
      font-size: 13px; font-weight: 600;
      color: var(--llm-accent-solid);
      cursor: pointer; width: 100%;
      margin-bottom: 12px;
      transition: background 0.15s;
    }
    .sidebar-new-btn:hover { background: rgba(6,182,212,0.18); }
    .sidebar-section-label {
      font-size: 10px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase;
      color: var(--llm-text-muted);
      padding: 0 4px; margin-bottom: 4px; margin-top: 8px;
    }
    .chat-history-item {
      border-radius: 8px;
      padding: 7px 10px;
      cursor: pointer;
      margin-bottom: 2px;
      transition: background 0.12s;
      position: relative;
    }
    .chat-history-item:hover { background: var(--llm-panel); }
    .chat-history-item.active {
      background: rgba(6,182,212,0.10);
      border-left: 2px solid var(--llm-accent-solid);
      padding-left: 8px;
    }
    .chat-history-item .item-title {
      font-size: 12px; font-weight: 500;
      color: var(--llm-text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .chat-history-item .item-meta {
      font-size: 10px; color: var(--llm-text-muted);
      margin-top: 1px;
    }
    .all-chats-link {
      margin-top: auto;
      border-top: 1px solid var(--llm-panel-border);
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px;
      font-size: 12px; font-weight: 500;
      color: var(--llm-text-muted);
      cursor: pointer; border-radius: 8px;
      transition: all 0.12s;
      border: 1px dashed var(--llm-panel-border);
    }
    .all-chats-link:hover { color: var(--llm-accent-solid); border-color: rgba(6,182,212,0.35); }

    /* ── Scheduled tasks ── */
    .sidebar-section { border-top: 1px solid var(--llm-panel-border); padding-top: 8px; margin-top: 8px; }
    .sidebar-section-header {
      display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; padding: 4px 0;
      font-size: 12px; font-weight: 600; color: var(--llm-text-muted);
      user-select: none;
    }
    .sidebar-section-header:hover { color: var(--llm-text); }
    .task-card {
      background: var(--llm-panel);
      border: 1px solid var(--llm-panel-border);
      padding: 8px; border-radius: 8px; margin-bottom: 6px; font-size: 11px;
    }
    .task-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
    .task-active-badge { color: #22c55e; font-size: 10px; }
    .task-delete-btn { background: none; border: none; cursor: pointer; font-size: 12px; opacity: 0.6; padding: 0 2px; }
    .task-delete-btn:hover { opacity: 1; }
    .task-schedule { font-family: monospace; color: var(--llm-text-muted); font-size: 10px; margin-bottom: 2px; }
    .task-prompt { color: var(--llm-text-muted); font-size: 10px; font-style: italic; }
    .tasks-empty { color: var(--llm-text-muted); font-size: 11px; font-style: italic; padding: 4px 0; }
    .add-task-btn {
      background: none; border: 1px dashed var(--llm-panel-border);
      color: var(--llm-text-muted); padding: 4px 10px; border-radius: 6px;
      cursor: pointer; font-size: 11px; margin-top: 4px; width: 100%;
    }
    .add-task-btn:hover { border-color: var(--llm-accent-solid); color: var(--llm-accent-solid); }
    .task-input {
      width: 100%; background: var(--llm-panel);
      border: 1px solid var(--llm-panel-border); color: var(--llm-text);
      padding: 4px 8px; border-radius: 4px; font-size: 11px; margin-top: 4px; box-sizing: border-box;
    }
    .btn-save-task { background: var(--llm-accent-solid); color: white; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; }
    .btn-cancel-task { background: var(--llm-panel); color: var(--llm-text-muted); border: 1px solid var(--llm-panel-border); padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; }

    /* ── Main area & topbar ── */
    .llm-main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
    .llm-topbar {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 20px;
      border-bottom: 1px solid var(--llm-panel-border);
      background: var(--llm-panel);
      backdrop-filter: var(--llm-blur);
      -webkit-backdrop-filter: var(--llm-blur);
      flex-shrink: 0;
    }
    .topbar-title {
      font-size: 14px; font-weight: 600; color: var(--llm-text);
      flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .model-pill {
      display: flex; align-items: center; gap: 6px;
      background: var(--llm-panel);
      border: 1px solid var(--llm-panel-border);
      border-radius: 20px; padding: 4px 10px 4px 8px;
      font-size: 12px; font-weight: 600; color: var(--llm-text-muted);
      cursor: pointer; transition: all 0.15s;
    }
    .model-pill:hover { border-color: rgba(6,182,212,0.40); color: var(--llm-text); }
    .model-status-dot {
      width: 7px; height: 7px; background: #22c55e; border-radius: 50%;
      box-shadow: 0 0 6px rgba(34,197,94,0.60);
    }
    .mode-pill {
      display: flex;
      background: var(--llm-panel);
      border: 1px solid var(--llm-panel-border);
      border-radius: 20px; padding: 3px; gap: 2px;
    }
    .mode-btn {
      padding: 4px 12px; border-radius: 14px;
      font-size: 11px; font-weight: 600;
      border: none; cursor: pointer;
      color: var(--llm-text-muted); background: transparent;
      transition: all 0.15s;
    }
    .mode-btn.active-chat {
      background: rgba(255,255,255,0.70); color: var(--llm-text);
      box-shadow: 0 1px 4px rgba(0,0,0,0.10);
    }
    html.dark .mode-btn.active-chat { background: rgba(255,255,255,0.12); }
    .mode-btn.active-image {
      background: linear-gradient(135deg,#7c3aed,#6366f1); color: white;
      box-shadow: 0 2px 8px rgba(124,58,237,0.35);
    }

    /* ── Messages ── */
    .llm-messages {
      flex: 1; overflow-y: auto;
      padding: 24px 20px;
      display: flex; flex-direction: column; gap: 16px;
      min-height: 0;
    }
    .llm-messages::-webkit-scrollbar { width: 5px; }
    .llm-messages::-webkit-scrollbar-thumb { background: var(--llm-panel-border); border-radius: 10px; }
    .message-user {
      align-self: flex-end; max-width: 80%;
      background: linear-gradient(135deg,#06b6d4,#0ea5e9);
      border-radius: 16px 16px 3px 16px;
      padding: 11px 16px;
      color: white;
      box-shadow: 0 3px 14px rgba(6,182,212,0.30);
      font-size: 14px; line-height: 1.6;
    }
    .message-gemma {
      align-self: flex-start; max-width: 85%;
      background: var(--llm-panel);
      border: 1px solid var(--llm-panel-border);
      border-radius: 16px 16px 16px 3px;
      padding: 11px 16px;
      color: var(--llm-text);
      backdrop-filter: var(--llm-blur);
      -webkit-backdrop-filter: var(--llm-blur);
      box-shadow: 0 2px 12px rgba(139,92,246,0.07);
      font-size: 14px; line-height: 1.6;
    }
    .msg-meta { font-size: 11px; color: var(--llm-text-muted); margin-top: 4px; padding: 0 4px; }

    /* ── Welcome screen ── */
    .welcome-screen {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      flex: 1; gap: 14px; padding: 40px; text-align: center;
    }
    .welcome-logo {
      width: 56px; height: 56px;
      background: linear-gradient(135deg,#06b6d4,#0ea5e9);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(6,182,212,0.40);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 800; color: white;
    }
    .welcome-title { font-size: 22px; font-weight: 700; color: var(--llm-text); }
    .welcome-sub { font-size: 14px; color: var(--llm-text-muted); max-width: 340px; line-height: 1.6; }
    .welcome-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 4px; }
    .welcome-chip {
      background: var(--llm-panel); border: 1px solid var(--llm-panel-border);
      border-radius: 20px; padding: 7px 14px;
      font-size: 12px; font-weight: 500; color: var(--llm-text-muted);
      cursor: pointer;
      backdrop-filter: var(--llm-blur);
      -webkit-backdrop-filter: var(--llm-blur);
      transition: all 0.15s;
    }
    .welcome-chip:hover { border-color: rgba(6,182,212,0.40); color: var(--llm-accent-solid); }

    /* ── Prose / markdown ── */
    .prose pre {
      background: var(--llm-panel);
      border: 1px solid var(--llm-panel-border);
      border-radius: 10px; padding: 1rem; margin-top: 0.5rem; overflow-x: auto;
    }
    .prose code {
      font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
      font-size: 0.875em;
      background: rgba(139,92,246,0.10);
      padding: 1px 5px; border-radius: 4px;
      color: var(--llm-accent-solid);
    }
    .prose pre code { background: none; padding: 0; color: inherit; }
    .prose p { margin-bottom: 0.75rem; }
    .prose p:last-child { margin-bottom: 0; }
    .prose strong { font-weight: 600; }
    .prose ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.75rem; }
    .prose ol { list-style-type: decimal; padding-left: 1.25rem; margin-bottom: 0.75rem; }

    /* ── Thinking / reasoning ── */
    .thought-block {
      background: rgba(139,92,246,0.06);
      border: 1px solid rgba(139,92,246,0.15);
      border-radius: 10px; padding: 10px 14px;
      margin-bottom: 10px; font-style: italic;
      font-size: 0.85em; color: var(--llm-text-muted);
    }
    .reasoning-block { border: 1px solid var(--llm-panel-border); border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
    .reasoning-block summary {
      cursor: pointer; padding: 6px 12px; font-size: 0.75em; font-weight: 600;
      color: var(--llm-text-muted); background: var(--llm-panel);
      user-select: none; list-style: none; display: flex; align-items: center; gap: 6px;
    }
    .reasoning-block summary::before { content: "▶"; font-size: 0.65em; transition: transform 0.15s; }
    .reasoning-block[open] summary::before { transform: rotate(90deg); }
    .reasoning-block .reasoning-body {
      padding: 10px 14px; font-size: 0.82em;
      color: var(--llm-text-muted); border-top: 1px solid var(--llm-panel-border);
    }

    /* ── Typing indicator ── */
    .typing-indicator { animation: llm-pulse 1.5s infinite; }
    @keyframes llm-pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }

    /* ── Input area ── */
    .llm-input-area { padding: 14px 20px 20px; flex-shrink: 0; }
    .llm-input-shell {
      background: var(--llm-panel);
      border: 1px solid var(--llm-panel-border);
      border-radius: 16px;
      backdrop-filter: var(--llm-blur);
      -webkit-backdrop-filter: var(--llm-blur);
      box-shadow: var(--llm-shadow);
      overflow: hidden;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .llm-input-shell:focus-within {
      border-color: rgba(6,182,212,0.50);
      box-shadow: 0 0 0 3px rgba(6,182,212,0.08), var(--llm-shadow);
    }
    .llm-input-row { display: flex; align-items: flex-end; gap: 8px; padding: 10px 12px; }
    .llm-attach-btn {
      width: 34px; height: 34px; border-radius: 9px; border: none;
      background: transparent; color: var(--llm-text-muted);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0; transition: all 0.15s;
    }
    .llm-attach-btn:hover { color: var(--llm-text); background: var(--llm-panel); }
    .llm-send-btn {
      width: 34px; height: 34px; border-radius: 9px; border: none;
      background: linear-gradient(135deg,#06b6d4,#0ea5e9); color: white;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.15s;
      box-shadow: 0 2px 8px rgba(6,182,212,0.40);
    }
    .llm-send-btn:hover { box-shadow: 0 4px 14px rgba(6,182,212,0.50); transform: translateY(-1px); }
    .llm-send-btn:disabled { opacity: 0.5; transform: none; }
    .llm-textarea {
      flex: 1; background: transparent; border: none; outline: none;
      font-family: 'Inter',sans-serif; font-size: 14px; color: var(--llm-text);
      resize: none; max-height: 160px; line-height: 1.5;
    }
    .llm-textarea::placeholder { color: var(--llm-text-muted); }
    .llm-input-footer {
      display: flex; align-items: center; gap: 8px;
      padding: 0 12px 8px;
      font-size: 11px; color: var(--llm-text-muted);
    }
    .drop-zone { transition: box-shadow 0.2s; }
    .drop-zone.active { box-shadow: 0 0 0 2px var(--llm-accent-solid) inset; }

    /* ── Image mode controls ── */
    .image-controls-row {
      display: none; padding: 8px 12px 4px; border-top: 1px solid var(--llm-panel-border);
      gap: 8px; flex-wrap: wrap; align-items: center;
    }
    .image-controls-row.visible { display: flex; }
    .img-ctrl {
      display: flex; align-items: center; gap: 5px;
      background: var(--llm-panel); border: 1px solid var(--llm-panel-border);
      border-radius: 8px; padding: 4px 10px; font-size: 11px;
    }
    .img-ctrl label { color: var(--llm-text-muted); font-weight: 600; }
    .img-ctrl select {
      border: none; background: transparent; font-size: 11px;
      color: var(--llm-text); font-weight: 600; cursor: pointer; outline: none;
    }
    .img-ctrl input[type="range"] { width: 56px; accent-color: #7c3aed; border: none; background: transparent; cursor: pointer; }
    .img-ctrl .steps-val { color: var(--llm-text); font-weight: 700; min-width: 20px; }
    .warmup-banner {
      display: none; background: rgba(124,58,237,0.10); border: 1px solid rgba(124,58,237,0.25);
      border-radius: 10px; padding: 7px 12px; font-size: 11px; color: #7c3aed;
      align-items: center; gap: 8px; margin: 0 12px 6px;
    }
    .warmup-banner.visible { display: flex; }
    .warmup-dot { width: 6px; height: 6px; background: #7c3aed; border-radius: 50%; animation: wdot 1s ease-in-out infinite alternate; }
    @keyframes wdot { from{opacity:0.4} to{opacity:1} }

    /* ── Image card ── */
    .img-card { background: var(--llm-panel); border: 1px solid var(--llm-panel-border); border-radius: 16px; overflow: hidden; max-width: 420px; }
    .img-card-shimmer {
      height: 220px;
      background: linear-gradient(90deg, var(--llm-panel) 25%, var(--llm-panel-border) 50%, var(--llm-panel) 75%);
      background-size: 200% 100%; animation: shimmer 1.4s infinite;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    .img-spinner { width: 24px; height: 24px; border: 2px solid var(--llm-panel-border); border-top-color: #7c3aed; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }
    .img-gen-label { font-size: 11px; color: var(--llm-text-muted); font-weight: 600; }
    .img-thumb-wrap { position: relative; cursor: pointer; }
    .img-thumb-wrap:hover .img-expand { opacity: 1; }
    .img-expand {
      position: absolute; inset: 0; background: rgba(0,0,0,0.35);
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 13px; font-weight: 600; opacity: 0; transition: opacity 0.18s;
    }
    .img-thumb { width: 100%; display: block; }
    .img-meta { padding: 6px 12px; font-size: 11px; color: var(--llm-text-muted); border-bottom: 1px solid var(--llm-panel-border); }
    .img-actions { display: flex; }
    .img-action-btn {
      flex: 1; padding: 7px 0; font-size: 11px; font-weight: 600;
      color: var(--llm-text-muted); background: none; border: none;
      border-right: 1px solid var(--llm-panel-border); cursor: pointer; transition: background 0.12s, color 0.12s;
    }
    .img-action-btn:last-child { border-right: none; }
    .img-action-btn:hover { background: rgba(6,182,212,0.08); color: var(--llm-accent-solid); }

    /* ── Agent trace ── */
    .agent-trace { margin: 8px 0; font-size: 12px; }
    .trace-summary {
      background: var(--llm-panel); border: 1px solid var(--llm-panel-border);
      padding: 6px 10px; border-radius: 8px; cursor: pointer;
      color: var(--llm-text-muted); user-select: none; display: flex; align-items: center; gap: 6px;
    }
    .trace-steps { padding-left: 8px; border-left: 2px solid var(--llm-panel-border); margin-top: 4px; }
    .trace-step { margin: 4px 0; }
    .trace-call { font-family: monospace; color: #22c55e; font-size: 11px; }
    .trace-result {
      font-family: monospace; color: var(--llm-text-muted); font-size: 10px;
      padding-left: 12px; white-space: pre-wrap; word-break: break-word;
      max-height: 60px; overflow: hidden;
    }
    .agent-done-message { padding: 8px 12px; color: #22c55e; font-size: 13px; }
    .agent-error-message { padding: 8px 12px; color: #ef4444; font-size: 13px; }

    /* ── Tool confirm card ── */
    .confirm-card {
      background: var(--llm-panel); border: 1px solid rgba(245,158,11,0.40);
      border-radius: 12px; padding: 14px; margin: 8px 0;
      backdrop-filter: var(--llm-blur); -webkit-backdrop-filter: var(--llm-blur);
      max-width: 440px;
    }
    .confirm-header { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-weight: 600; color: #f59e0b; font-size: 13px; }
    .confirm-args { background: var(--llm-panel); border: 1px solid var(--llm-panel-border); padding: 8px; border-radius: 8px; font-family: monospace; font-size: 10px; margin: 8px 0; white-space: pre-wrap; color: var(--llm-text-muted); }
    .confirm-desc { color: var(--llm-text-muted); font-size: 11px; margin-bottom: 10px; }
    .confirm-buttons { display: flex; gap: 8px; }
    .btn-allow { background: #22c55e; color: white; border: none; padding: 6px 16px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; }
    .btn-deny { background: rgba(239,68,68,0.12); color: #ef4444; border: 1px solid rgba(239,68,68,0.30); padding: 6px 16px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; }
    .btn-always { background: transparent; color: var(--llm-text-muted); border: 1px solid var(--llm-panel-border); padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 11px; }

    /* ── Context menu ── */
    #context-menu {
      position: fixed; background: var(--llm-panel); border: 1px solid var(--llm-panel-border);
      border-radius: 10px; box-shadow: var(--llm-shadow); padding: 4px; z-index: 1000;
      min-width: 160px; display: none;
      backdrop-filter: var(--llm-blur); -webkit-backdrop-filter: var(--llm-blur);
    }
    .context-menu-item {
      padding: 8px 12px; cursor: pointer; font-size: 13px;
      display: flex; align-items: center; gap: 8px; border-radius: 6px;
      color: var(--llm-text); transition: background 0.12s;
    }
    .context-menu-item:hover { background: var(--llm-panel); }
    .context-menu-item.danger { color: #ef4444; }
    .context-menu-item.danger:hover { background: rgba(239,68,68,0.08); }

    /* ── All-chats modal items ── */
    .all-chats-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; border-bottom: 1px solid var(--llm-panel-border);
      cursor: pointer; transition: background 0.12s;
    }
    .all-chats-item:hover { background: var(--llm-panel); }
    .all-chats-item.selected { background: rgba(6,182,212,0.08); }
    .all-chats-checkbox { width: 16px; height: 16px; border-radius: 4px; border: 2px solid var(--llm-panel-border); cursor: pointer; accent-color: var(--llm-accent-solid); }

    /* ── Modals ── */
    .modal-overlay {
      background: rgba(0,0,0,0.50);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      transition: opacity 0.3s;
    }
    .modal-content {
      background: var(--llm-panel); border: 1px solid var(--llm-panel-border);
      border-radius: 16px;
      backdrop-filter: var(--llm-blur); -webkit-backdrop-filter: var(--llm-blur);
      box-shadow: var(--llm-shadow);
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    .hidden-modal { opacity: 0; pointer-events: none; }
    .hidden-modal .modal-content { transform: scale(0.95) translateY(16px); }

    /* ── Lightbox ── */
    .lightbox-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 200; display: none; align-items: center; justify-content: center; padding: 24px; }
    .lightbox-overlay.open { display: flex; }
    .lightbox-inner { display: flex; gap: 20px; max-width: 900px; width: 100%; align-items: flex-start; }
    .lightbox-img-wrap { flex: 1; min-width: 0; }
    .lightbox-img-wrap img { width: 100%; border-radius: 12px; display: block; }
    .lightbox-sidebar { width: 180px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
    .lb-title { color: white; font-size: 14px; font-weight: 700; }
    .lb-prompt-text { color: var(--llm-text-muted); font-size: 12px; line-height: 1.5; word-break: break-word; }
    .lb-meta-text { color: var(--llm-text-muted); font-size: 11px; }
    .lb-btn { padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; border: none; cursor: pointer; width: 100%; text-align: center; }
    .lb-btn-primary { background: #7c3aed; color: white; }
    .lb-btn-primary:hover { background: #6d28d9; }
    .lb-btn-secondary { background: rgba(255,255,255,0.10); color: white; margin-top: 4px; }
    .lb-btn-secondary:hover { background: rgba(255,255,255,0.18); }
    .lb-close-btn { color: var(--llm-text-muted); font-size: 12px; text-align: center; cursor: pointer; margin-top: 6px; background: none; border: none; width: 100%; }
    .lb-close-btn:hover { color: white; }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      .sidebar-panel { position: fixed; left: 56px; height: 100%; }
      .sidebar-panel.panel-hidden { display: none; }
    }
  </style>
</head>
<body>
<!-- ── Icon Rail ── -->
<div class="rail" id="rail">
  <div class="rail-logo">L</div>

  <button class="rail-btn active" id="rail-chat-btn" title="Chat history">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  </button>

  <button class="rail-btn" id="rail-image-btn" title="Image generation">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
  </button>

  <button class="rail-btn" id="rail-tasks-btn" title="Scheduled tasks">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
  </button>

  <div class="rail-divider"></div>

  <button class="rail-btn" id="open-settings-btn" title="Settings">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 1 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>

  <div class="rail-spacer"></div>

  <button class="rail-theme-toggle" id="theme-toggle" title="Toggle theme"></button>
  <div class="rail-avatar" title="You">O</div>
</div>

<!-- ── Sidebar Overlay Panel ── id="sidebar" preserved for JS compat -->
<div class="sidebar-panel" id="sidebar">

  <!-- New chat button — id="new-chat-btn" preserved -->
  <button class="sidebar-new-btn" id="new-chat-btn">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
    New Chat
  </button>

  <!-- Starred chats — id="starred-section" and id="starred-list" preserved -->
  <div id="starred-section" class="hidden">
    <div class="sidebar-section-label" style="color:#f59e0b;">★ Starred</div>
    <div id="starred-list"></div>
  </div>

  <!-- Chat history — id="history-list" preserved -->
  <div class="sidebar-section-label">Recents</div>
  <div id="history-list" style="flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;"></div>

  <!-- Scheduled tasks — ids preserved -->
  <div class="sidebar-section">
    <div class="sidebar-section-header" onclick="toggleScheduledPanel()">
      <span>📅 Scheduled Tasks</span>
      <span id="scheduled-chevron">▼</span>
    </div>
    <div id="scheduled-tasks-body" style="display:none;">
      <div style="margin:8px 0;">
        <div style="font-size:11px;font-weight:600;color:var(--llm-accent-solid);margin-bottom:6px;">🤖 In-App Tasks</div>
        <div id="in-app-tasks-list"></div>
        <button class="add-task-btn" onclick="showAddTaskForm()">+ Add Task</button>
        <div id="add-task-form" style="display:none;">
          <input id="new-task-name" type="text" placeholder="Task name" class="task-input" />
          <input id="new-task-schedule" type="text" placeholder="Cron (e.g. 0 9 * * *)" class="task-input" />
          <textarea id="new-task-prompt" placeholder="Prompt" class="task-input" rows="2" style="resize:vertical;"></textarea>
          <div style="display:flex;gap:6px;margin-top:4px;">
            <button class="btn-save-task" onclick="submitAddTask()">Save</button>
            <button class="btn-cancel-task" onclick="showAddTaskForm()">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- All Chats button -->
  <div class="all-chats-link" onclick="showAllChats()">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M12 7v10"/><path d="M8 11h8"/></svg>
    All Chats
  </div>
</div>
